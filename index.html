<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="css/iwebkit.css" rel="stylesheet" media="screen">
    <script src="javascript/zepto.min.js"></script>
    <script src="javascript/iwebkit.js"></script>
    <title>SoftwareKit Legacy</title>

    <style>
        /* 1. PREVENT BLINKING & FIX LAYOUT */
        body {
            margin: 0;
            padding: 0;
            padding-bottom: 50px; /* Space for the tab bar */
            -webkit-user-select: none;
            -webkit-text-size-adjust: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0); /* Removes the gray flash on tap */
        }

        /* 2. THE STABLE TOOLBAR */
        #tabbar-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 49px;
            background: -webkit-gradient(linear, left top, left bottom, from(#454545), color-stop(0.5, #111111), to(#000000));
            border-top: 1px solid #000;
            display: -webkit-box;
            -webkit-box-orient: horizontal;
            /* Force Hardware Acceleration to prevent flickering */
            -webkit-transform: translate3d(0,0,0);
        }

        .tab-btn {
            -webkit-box-flex: 1;
            display: block;
            text-align: center;
            text-decoration: none;
            color: #999;
            font-size: 10px;
            font-weight: bold;
            padding-top: 6px;
        }

        .tab-btn img {
            height: 24px;
            display: block;
            margin: 0 auto 1px auto;
            pointer-events: none; /* Prevents image from blocking the tap */
        }

        /* 3. PERSISTENT ACTIVE STATE */
        .tab-btn.active {
            color: #ffffff !important;
            background: -webkit-gradient(linear, left top, left bottom, from(rgba(2, 118, 245, 0.6)), to(rgba(0,0,0,0))) !important;
        }

        /* 4. CONTENT SECTIONS */
        .tab-page {
            display: none;
            -webkit-overflow-scrolling: touch;
        }
        .tab-page.visible {
            display: block;
        }
    </style>
</head>

<body>

<header>
    <h1 id="nav-title">Apps</h1>
</header>

<div id="main-container">

    <section id="view-apps" class="tab-page visible">
        <section id="content">
            <header><h2>Network Utilities</h2></header>
            <nav data-image-type="icon">
                <a href="#"><img src="images/icon.png" alt=""><p>Wi-Fi</p></a>
            </nav>
        </section>
    </section>

    <section id="view-utils" class="tab-page">
        <section id="content">
            <header><h2>Utilities</h2></header>
            <nav data-image-type="none">
                <a href="#"><p>Battery Info</p></a>
            </nav>
        </section>
    </section>

    <section id="view-settings" class="tab-page">
        <section id="content">
            <header><h2>Settings</h2></header>
            <form>
                <fieldset data-input-type="checkbox">
                    <input type="checkbox" checked><label>Legacy Mode</label>
                </fieldset>
            </form>
        </section>
    </section>

</div>

<footer id="tabbar-fixed">
    <a href="#view-apps" class="tab-btn active" data-name="Apps">
        <img src="svg/plus.svg" />
        <span>Apps</span>
    </a>
    <a href="#view-utils" class="tab-btn" data-name="Utilities">
        <img src="svg/bookmark.svg" />
        <span>Utils</span>
    </a>
    <a href="#view-settings" class="tab-btn" data-name="Settings">
        <img src="svg/tabs.svg" />
        <span>Settings</span>
    </a>
</footer>

<script>
$(function() {
    // USE 'ON' WITH STOP PROPAGATION TO PREVENT IWEBKIT INTERFERENCE
    $('.tab-btn').on('tap click', function(e) {
        e.preventDefault();
        e.stopPropagation(); // Stops iwebkit.js from trying to "load" the link

        // Update Buttons
        $('.tab-btn').removeClass('active');
        $(this).addClass('active');

        // Update Pages
        var targetPage = $(this).attr('href');
        $('.tab-page').removeClass('visible');
        $(targetPage).addClass('visible');

        // Update Title
        var title = $(this).attr('data-name');
        $('#nav-title').text(title);

        // Prevent page jump
        window.scrollTo(0,0);
        return false;
    });
});
</script>

</body>
</html>
