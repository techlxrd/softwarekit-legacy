<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="css/iwebkit.css" rel="stylesheet" media="screen">
    <script src="javascript/zepto.min.js"></script>
    <script src="javascript/iwebkit.js"></script>
    <title>SoftwareKit Legacy</title>
    
    <style>      
        #tabbar-fixed {
            position: fixed;
            bottom: 0; left: 0; z-index: 9999;
            width: 100%; height: 49px;
            background: -webkit-gradient(linear, left top, left bottom, from(#454545), color-stop(0.5, #111111), to(#000000));
            border-top: 1px solid #000;
            display: -webkit-box;
            -webkit-box-orient: horizontal;
            -webkit-transform: translate3d(0,0,0);
        }

        .tab-btn {
            -webkit-box-flex: 1;
            display: block;
            text-align: center;
            text-decoration: none;
            color: #9c9c9c;
            font-size: 10px;
            font-weight: bold;
            padding-top: 6px;
        }       
        .tab-btn.active {
            color: #ffffff !important;
            background: -webkit-gradient(linear, left top, left bottom, from(#0276f5), to(#01499a));
            -webkit-box-shadow: inset 0px 0px 10px rgba(0,0,0,0.5);
        }       
        .tab-btn.active img {
            -webkit-filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.8));
        }

        .tab-btn img {
            height: 24px;
            display: block;
            margin: 0 auto 1px auto;
            pointer-events: none;
        }
       
        .tab-page { display: none; }
        .tab-page.visible { display: block; }

    </style>
</head>

<body data-ui-type="native">

<header>
    <h1 id="nav-title">Apps & Utilities</h1>
</header>

<div id="main-container">

    <section id="view-apps" class="tab-page visible">
        <div id="content">
            <header><h2>Network Test</h2></header>
            
            <section>
                <article>
                    <header><h3>Introduction:</h3></header>
                    <p>SoftwareKit Legacy</p>
                </article>
            </section>

            <aside>
                <p>Extra Info: TechLxrd</p>
            </aside>

            <nav data-image-type="icon">
                <a href="#">
                    <img src="images/icon.png" alt="icon">
                    <p>SoftwafeKit</p>
                    <small>SoftwareKit Legacy test</small>
                </a>
                <a href="#">
                    <img src="images/icon.png" alt="icon">
                    <p>Gamecenter</p>
                </a>
            </nav>

            <nav data-image-type="none">
                <a href="#"><p>Other options</p></a>
            </nav>
        </div>
    </section>

    <section id="view-repos" class="tab-page">
        <div id="content">
            <header><h2>Jailbreak Repositories</h2></header>
            <nav data-image-type="none">
                <a href="#"><p>BigBoss Repo</p></a>
                <a href="#"><p>ModMyi</p></a>
            </nav>
        </div>
    </section>

    <section id="view-settings" class="tab-page">
        <div id="content">
            <header><h2>Settings & Information</h2></header>
            <form>
                <fieldset data-input-type="checkbox">
                    <input type="checkbox" checked><label>Enable Legacy Mode</label>
                </fieldset>
            </form>          
        </div>
    </section>

</div>

<footer id="tabbar-fixed">
    <a href="#view-apps" class="tab-btn active" data-name="Apps & Utilities">
        <img src="svg/plus.svg" />
        <span>Apps & Utils</span>
    </a>
    <a href="#view-repos" class="tab-btn" data-name="JB Repositories">
        <img src="svg/bookmark.svg" />
        <span>JB Repos</span>
    </a>
    <a href="#view-settings" class="tab-btn" data-name="Settings & Info">
        <img src="svg/tabs.svg" />
        <span>Settings</span>
    </a>
</footer>

<script>
$(function() {
    $('.tab-btn').on('tap click', function(e) {
        e.preventDefault();
        e.stopPropagation();

        // 1. Change tab appearance
        $('.tab-btn').removeClass('active');
        $(this).addClass('active');

        // 2. Switch the view
        var targetPage = $(this).attr('href');
        $('.tab-page').removeClass('visible');
        $(targetPage).addClass('visible');

        // 3. Update the Header Text
        var title = $(this).attr('data-name');
        $('#nav-title').text(title);

        window.scrollTo(0,0);
        return false;
    });
});
</script>

</body>
</html>
